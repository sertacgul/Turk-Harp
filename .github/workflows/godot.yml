name: godot

on:
  push:
  pull_request:

env:
  GODOT_VERSION: "4.7"

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --import --path . 2>&1 | tee import.log; ! grep -E "SCRIPT ERROR|Parse Error" import.log
      - name: Autoplay scenarios (AI vs AI)
        run: |
          for sc in 18mart_1915 ariburnu_1915 conkbayiri_1915; do
            timeout 600 godot --headless --path . res://tools/shot.tscn -- \
              scene=res://scenes/battle.tscn scenario=res://data/scenarios/$sc.json \
              cmds=1:debug_skip_intro,2:debug_autoplay,500:quit 2>&1 | tee $sc.log
            grep -q "phase=over" $sc.log
          done
      - name: Load main menu
        run: godot --headless --path . res://tools/shot.tscn -- cmds=3:show_campaign,4:quit 2>&1 | tee menu.log
      - name: Fail on script errors
        run: "! grep -E 'SCRIPT ERROR' *.log"

  export:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: macOS
            path: build/macos/TurkHarp.zip
          - preset: Windows
            path: build/windows/TurkHarp.exe
          - preset: Linux
            path: build/linux/TurkHarp.x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
      - name: Export ${{ matrix.preset }}
        run: |
          mkdir -p $(dirname ${{ matrix.path }})
          godot --headless --path . --import
          godot --headless --path . --export-release "${{ matrix.preset }}" ${{ matrix.path }}
          ls -la build/*
      - uses: actions/upload-artifact@v4
        with:
          name: TurkHarp-${{ matrix.preset }}
          path: build/
